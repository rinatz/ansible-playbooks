---
- name: Install packages
  become: true
  ansible.builtin.apt:
    state: present
    update_cache: true
    cache_valid_time: 3600
    name:
      - language-pack-ja
      - locales
  tags:
    - locale

- name: Generate Japanese locale
  become: true
  community.general.locale_gen:
    name: ja_JP.UTF-8
    state: present
  tags:
    - locale

- name: Set default locale
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^LANG="
    line: LANG=ja_JP.UTF-8
    create: true
    mode: "0644"
  tags:
    - locale

- name: Set timezone
  become: true
  community.general.timezone:
    name: Asia/Tokyo
  tags:
    - locale
